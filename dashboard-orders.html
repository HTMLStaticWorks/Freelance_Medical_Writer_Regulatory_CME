<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | MedWrite Pro Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>

<body>
    <div class="dashboard-wrapper">
        <aside id="dashboardSidebar" class="dashboard-sidebar">
            <div class="brand mb-5 d-flex align-items-center gap-2">
                <i class="bi bi-shield-plus text-primary fs-3"></i>
                <span class="fw-bold fs-4">MedWrite Pro</span>
            </div>
            <nav class="nav flex-column gap-2 mb-auto">
                <a class="nav-link" href="dashboard.html"><i class="bi bi-graph-up-arrow"></i> Analytics</a>
                <a class="nav-link" href="dashboard-users.html"><i class="bi bi-people"></i> Users</a>
                <a class="nav-link active" href="dashboard-orders.html"><i class="bi bi-bag-check"></i> Orders</a>
                <a class="nav-link" href="dashboard-messages.html"><i class="bi bi-chat-dots"></i> Messages</a>
            </nav>
            <div class="mt-4">
                <a class="nav-link text-danger" href="index.html"><i class="bi bi-box-arrow-left"></i> Logout</a>
            </div>
        </aside>

        <main class="dashboard-main">
            <div class="dashboard-topbar">
                <div class="d-flex align-items-center gap-3">
                    <button id="sidebarToggle" class="btn btn-light d-xl-none"><i class="bi bi-list"></i></button>
                    <h2 class="mb-0 fs-4">Orders</h2>
                </div>
                <div class="d-flex align-items-center gap-4">
                    <div class="search-box d-none d-md-block">
                        <input type="text" class="form-control rounded-pill px-4" placeholder="Search projects...">
                    </div>
                    <div class="notifications position-relative">
                        <i class="bi bi-bell-fill fs-5 text-muted"></i>
                        <span
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">3</span>
                    </div>
                    <div class="user-profile d-flex align-items-center gap-2">
                        <img src="https://ui-avatars.com/api/?name=Pharma+Client&background=0ea5e9&color=fff"
                            class="rounded-circle" width="40" height="40">
                        <div class="d-none d-sm-block">
                            <p class="small fw-bold mb-0">PharmaCorp Inc.</p>
                            <p class="small text-muted mb-0">Project Manager</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="compliance-list">
                <h5 class="mb-4">Orders Details</h5>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Order ID</th>
                                <th>Service</th>
                                <th>Due Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>ORD-2107</td>
                                <td>Regulatory Summary</td>
                                <td>May 15, 2026</td>
                                <td><span class="status-badge status-review">In Review</span></td>
                            </tr>
                            <tr>
                                <td>ORD-2108</td>
                                <td>CER Update</td>
                                <td>May 18, 2026</td>
                                <td><span class="status-badge status-pending">Pending</span></td>
                            </tr>
                            <tr>
                                <td>ORD-2099</td>
                                <td>Safety Narrative</td>
                                <td>May 02, 2026</td>
                                <td><span class="status-badge status-completed">Completed</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/dashboard.js"></script>
</body>

</html>
