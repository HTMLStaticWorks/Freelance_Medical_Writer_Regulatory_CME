<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MedWrite Pro - Secure Pharma Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        .auth-top {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .auth-top .dark-mode-toggle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--medical-blue);
            background: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }

        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top left, #f8fafc, #e2e8f0);
            padding: 90px 20px 20px;
        }

        body.dark-mode .auth-top .dark-mode-toggle {
            color: #f8fafc;
        }

        body.dark-mode .auth-wrapper {
            background: radial-gradient(circle at top left, #0f172a, #020617);
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(15px);
            border: 1px solid #dbe3ee;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            color: #0f172a;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .form-control {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0f172a !important;
            border-radius: 10px;
            padding: 12px 15px;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .password-wrap {
            position: relative;
        }

        .password-input {
            padding-inline-end: 46px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #64748b;
            font-size: 1.05rem;
            line-height: 1;
            padding: 0;
            cursor: pointer;
        }

        [dir="rtl"] .password-toggle {
            right: auto;
            left: 12px;
        }

        .social-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(15, 23, 42, 0.6);
            font-size: 0.8rem;
            margin-bottom: 16px;
        }

        .social-divider::before,
        .social-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(15, 23, 42, 0.15);
        }

        .social-auth-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .social-auth-btn {
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #1e293b;
            border-radius: 10px;
            padding: 10px 8px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: 0.2s ease;
        }

        .social-auth-btn:hover {
            background: #eff6ff;
            color: #1e293b;
            border-color: rgba(14, 165, 233, 0.55);
        }

        body.dark-mode .auth-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
        }

        body.dark-mode .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff !important;
        }

        body.dark-mode .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        body.dark-mode .password-toggle {
            color: rgba(255, 255, 255, 0.7);
        }

        body.dark-mode .social-divider {
            color: rgba(255, 255, 255, 0.6);
        }

        body.dark-mode .social-divider::before,
        body.dark-mode .social-divider::after {
            background: rgba(255, 255, 255, 0.15);
        }

        body.dark-mode .social-auth-btn {
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
            color: #f8fafc;
        }

        body.dark-mode .social-auth-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #f8fafc;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
            }

            .btn-premium.py-3 {
                padding-top: 12px !important;
                padding-bottom: 12px !important;
            }

            .form-check-label {
                font-size: 0.8rem !important;
                white-space: nowrap;
            }

            .social-auth-btn {
                font-size: 0.75rem !important;
                padding: 10px 4px !important;
                gap: 4px !important;
            }
        }
    </style>
</head>

<body>

    <div class="auth-top">
        <div id="darkModeToggle" class="dark-mode-toggle"><i class="bi bi-moon"></i></div>
        <button id="rtlToggle" type="button" class="rtl-toggle" aria-label="Toggle RTL"><i
                class="bi bi-arrow-left-right"></i></button>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="text-center mb-5">
                <a href="index.html" class="navbar-brand d-inline-flex align-items-center justify-content-center mb-3">
                    <i class="bi bi-shield-plus"></i>
                    <span>MedWrite Pro</span>
                </a>
                <p class="text-muted small">Collaboration Request for Pharma & Clinical Teams</p>
            </div>

            <form>
                <div class="row g-3">
                    <div class="col-12 mb-3">
                        <label class="form-label small fw-bold">Full Name</label>
                        <input type="text" class="form-control" placeholder="John Doe">
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label small fw-bold">Company Name</label>
                        <input type="text" class="form-control" placeholder="Pharma Inc.">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Work Email</label>
                    <input type="email" class="form-control" placeholder="name@company.com">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Service Interest</label>
                    <select class="form-control form-select">
                        <option>Regulatory Writing</option>
                        <option>CER Documentation</option>
                        <option>CME Development</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Password</label>
                    <div class="password-wrap">
                        <input id="registerPassword" type="password" class="form-control password-input"
                            placeholder="........">
                        <button type="button" class="password-toggle" data-password-toggle
                            data-target="registerPassword" aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="terms">
                    <label class="form-check-label small" for="terms">I agree to the <a href="#"
                            class="text-primary">Data Protection Policy</a></label>
                </div>
                <a href="dashboard.html" class="btn btn-premium w-100 py-3 mb-4">Submit Access Request</a>
            </form>

            <div class="social-divider">OR CONTINUE WITH</div>
            <div class="social-auth-grid">
                <a href="#" class="social-auth-btn"><i class="bi bi-google"></i>Google</a>
                <a href="#" class="social-auth-btn"><i class="bi bi-apple"></i>Apple</a>
                <a href="#" class="social-auth-btn"><i class="bi bi-facebook"></i>Facebook</a>
            </div>

            <p class="text-center small text-muted mb-0">Already have access? <a href="login.html"
                    class="text-primary text-decoration-none fw-bold">Login here</a></p>
        </div>
    </div>
    <script src="assets/js/main.js"></script>
    <script>
        (function () {
            document.querySelectorAll('[data-password-toggle]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const input = document.getElementById(btn.getAttribute('data-target'));
                    if (!input) return;
                    const visible = input.type === 'text';
                    input.type = visible ? 'password' : 'text';
                    btn.innerHTML = visible ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
                });
            });
        })();
    </script>
</body>

</html>
